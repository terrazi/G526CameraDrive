
name: G526CameraDrive iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iPhone App
    runs-on: macos-15

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iPhone application
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_REVERSED_CLIENT_ID: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project G526CameraDrive.xcodeproj \
            -scheme G526CameraDrive \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData \
            CODE_SIGNING_ALLOWED=NO \
            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            GOOGLE_REVERSED_CLIENT_ID="$GOOGLE_REVERSED_CLIENT_ID" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/DeviceData/Build/Products/Debug-iphoneos/G526CameraDrive.app build/ipa/Payload/
          cd build/ipa
          ditto -c -k --sequesterRsrc --keepParent Payload G526CameraDrive-unsigned.ipa

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-iPhone-IPA
          path: build/ipa/G526CameraDrive-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G526CameraDrive-Build-Log
          path: build.log
          if-no-files-found: ignore
