
name: G526CameraDrive

options:
  bundleIdPrefix: com.huseyinozer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0

targets:
  G526CameraDrive:
    type: application
    platform: iOS

    sources:
      - path: Sources

    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.huseyinozer.g526
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Sesli komutları algılamak için mikrofon erişimi gerekir."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Sesli komutları algılamak için konuşma tanıma erişimi gerekir."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "G526 kameraya bağlanmak için yerel ağ erişimi gerekir."
        INFOPLIST_KEY_GIDClientID: "$(GOOGLE_CLIENT_ID)"
